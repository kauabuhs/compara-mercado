  #   runs-on: ubuntu-latest
  #   environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: echo "build da imagem backend/apps/api/Dockerfile e deploy no host escolhido"
