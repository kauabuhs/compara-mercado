version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    cooldown: { default-days: 7 } # espera 7 dias após a publicação (mesma política do pnpm)
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "ci" }

  - package-ecosystem: docker
    directory: /ComparaMercado-Back # Dockerfile.worker
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "chore(worker)" }

  - package-ecosystem: docker
    directory: /ComparaMercado-Back # Dockerfile (API)
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "chore(api)" }
