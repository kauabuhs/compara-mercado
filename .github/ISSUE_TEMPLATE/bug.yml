name: Bug
description: Algo não funciona como o esperado
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: O que aconteceu?, description: "Inclua o que você esperava." }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Como reproduzir }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: "Onde? (aparelho/navegador/ambiente)" }
  - type: markdown
    attributes:
      value: "⚠️ Não cole segredos, chaves nem dados pessoais. Vulnerabilidades: veja SECURITY.md."
