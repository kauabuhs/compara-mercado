packages:
  # Duas aplicações independentes, como no ProAgendaV2: Back e Front. O contrato HTTP mora em
  # ComparaMercado-Back/src/contracts e o Front o lê pelo alias @contracts (ver docs/adr/0007).
  - "ComparaMercado-Back"
  - "ComparaMercado-Front"

# Endurecimento da cadeia de suprimentos (ver docs/adr/0002-supply-chain.md)
# Só instala versões publicadas há 7 dias ou mais
minimumReleaseAge: 10080
# Bloqueia dependências transitivas vindas de git/tarball
blockExoticSubdeps: true
# Impede que uma atualização rebaixe as garantias de publicação (provenance)
trustPolicy: no-downgrade
allowBuilds:
  esbuild: false
